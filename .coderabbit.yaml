# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!pubspec.lock"
    - "!**/generated/**"

chat:
  auto_reply: true
