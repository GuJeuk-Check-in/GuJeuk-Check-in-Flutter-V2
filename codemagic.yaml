definitions:
  gujeuk_environment: &gujeuk_environment
    flutter: stable
    java: 17
    groups:
      # Codemagic Teams > Environment variables 에서 만든 그룹. API_BASE_URL 을 담는다.
      - gujeuk
  gujeuk_setup:
    - &gujeuk_env_file
      name: .env.gujeuk 만들기
      script: |
        # .env.gujeuk 은 gitignore 대상이라 저장소에 없으므로 환경 변수로 만든다.
        echo "API_BASE_URL=$API_BASE_URL" > .env.gujeuk
    - &bubdong_env_file
      name: .env.bubdong 만들기 (분석용)
      script: |
        # pubspec에 등록된 .env.bubdong 이 없으면 정적 분석이 실패하므로 예시 파일로 만든다.
        cp .env.bubdong.example .env.bubdong
    - &pub_get
      name: 패키지 받기
      script: flutter pub get

workflows:
  # PR을 열거나 커밋을 더 올릴 때. 빠르게 분석하고 컴파일되는지만 본다.
  gujeuk-pr:
    name: 구즉 Android PR 확인
    instance_type: mac_mini_m2
    environment: *gujeuk_environment
    triggering:
      events:
        - pull_request
      branch_patterns:
        # source: false 는 PR이 들어가는 쪽 브랜치를 뜻한다.
        - pattern: develop
          include: true
          source: false
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - *gujeuk_env_file
      - *bubdong_env_file
      - *pub_get
      - name: 정적 분석
        script: flutter analyze
      - name: 구즉 debug 빌드
        script: flutter build appbundle --debug --flavor gujeuk -t lib/main_gujeuk.dart

  # main 에 머지될 때. 코드 축소(R8) 등 release 에서만 생기는 문제까지 본다.
  gujeuk-release:
    name: 구즉 Android release
    instance_type: mac_mini_m2
    environment: *gujeuk_environment
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - *gujeuk_env_file
      - *bubdong_env_file
      - *pub_get
      - name: 정적 분석
        script: flutter analyze
      - name: 구즉 release 빌드
        script: flutter build appbundle --release --flavor gujeuk -t lib/main_gujeuk.dart
    artifacts:
      - build/app/outputs/bundle/**/*.aab

  # 법동: PR을 열거나 커밋을 더 올릴 때. 분석하고 법동 앱이 빌드되는지 본다.
  bubdong-pr:
    name: 법동 Android PR 확인
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - pull_request
      branch_patterns:
        # source: false 는 PR이 들어가는 쪽 브랜치를 뜻한다.
        - pattern: develop
          include: true
          source: false
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - *bubdong_env_file
      - name: .env.gujeuk 만들기 (분석용)
        script: |
          # pubspec에 등록된 .env.gujeuk 이 없으면 정적 분석이 실패하므로 예시 파일로 만든다.
          cp .env.gujeuk.example .env.gujeuk
      - *pub_get
      - name: 정적 분석
        script: flutter analyze
      - name: 법동 debug 빌드
        script: flutter build appbundle --debug --flavor bubdong -t lib/main_bubdong.dart